<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Teaching Sandbox</title>
    <style>
      /* Base Resets */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #0f172a;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Outer Container Box */
      .flex-container {
        width: 500px;
        min-height: 350px;
        background-color: #1e293b;
        border: 2px dashed #38bdf8;
        border-radius: 12px;
        padding: 20px;

        /* WRITE YOUR LIVE FLEXBOX LINES HERE! */
      }

      /* Small Base Inner Boxes */
      .box {
        width: 70px;
        height: 70px;
        background-color: #0284c7;
        color: #ffffff;
        font-size: 1.25rem;
        font-weight: bold;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <!-- Main Box in the middle of the screen -->
    <div class="flex-container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>
  </body>
</html>
